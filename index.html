<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <!-- Link to our CSS file for styling (we will write this in Step 2) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Wrapper Container -->
    <div class="app-container">

        <!-- 1. Header Section: Title and Dark/Light Mode Button -->
        <header class="header">
            <h1>Weather Dashboard</h1>
            <button id="theme-toggle-btn" class="theme-btn">🌙 Dark Mode</button>
        </header>

        <!-- 2. Search Section: Input Box and Search Button -->
        <section class="search-section">
            <input type="text" id="city-input" placeholder="Enter city name (e.g. London)..." />
            <button id="search-btn">Search</button>
        </section>

        <!-- 3. Loading State: Shown while fetching weather data from API -->
        <div id="loading" class="loading-box hidden">
            <p>Loading weather data...</p>
        </div>

        <!-- 4. Error Message: Shown if city is not found or API fails -->
        <div id="error-message" class="error-box hidden"></div>

        <!-- 5. Current Weather Card Section -->
        <section id="weather-section" class="weather-section hidden">
            <div class="current-weather-card">
                <div class="card-header">
                    <h2 id="city-name">--</h2>
                    <button id="add-favorite-btn" class="favorite-btn">⭐ Add to Favorites</button>
                </div>
                
                <div class="weather-main">
                    <img id="weather-icon" src="" alt="Weather Condition Icon" />
                    <div class="temp-container">
                        <div id="temperature" class="temp-display">--°C</div>
                        <div id="weather-condition" class="condition-display">--</div>
                    </div>
                </div>

                <div class="weather-details">
                    <p><strong>Feels Like:</strong> <span id="feels-like">--</span></p>
                    <p><strong>Humidity:</strong> <span id="humidity">--</span></p>
                    <p><strong>Wind Speed:</strong> <span id="wind-speed">--</span></p>
                </div>
            </div>
        </section>

        <!-- 6. 5-Day Forecast Section -->
        <section id="forecast-section" class="forecast-section hidden">
            <h3>5-Day Forecast</h3>
            <div id="forecast-cards" class="forecast-cards-container">
                <!-- 5-day forecast cards will be dynamically added here by JavaScript -->
            </div>
        </section>

        <!-- 7. Favorites Section -->
        <section id="favorites-section" class="favorites-section">
            <h3>Saved Favorite Cities</h3>
            <div id="favorites-list" class="favorites-list-container">
                <!-- Favorite city buttons will be dynamically added here by JavaScript -->
            </div>
        </section>

    </div>

    <!-- Link to our JavaScript logic file (we will write this in later steps) -->
    <script src="script.js"></script>
</body>
</html>
